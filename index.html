<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>沉浸式租屋平台</title>
    <!-- 這一行就是引入 style.css 的位置 -->
    <link rel="stylesheet" href="/src/style.css"> 
    <!-- 引入 Google Fonts 增加質感 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  </head>
  
  <body>
    <!-- 3D Viewer 容器 -->
    <div id="app"></div>

    <!-- UI 覆蓋層 (Overlay) -->
    <div id="ui-container">
      
      <!-- 頂部導航
      <nav class="navbar">
        <div class="logo">3D_Platfrom</div>
        <div class="status-badge">🟢 線上帶看</div>
      </nav> -->

      <!-- ✨ 宣傳橫幅 (科技藍風格 + 記住關閉狀態) -->
      <div class="promo-banner" id="promo-banner">
        <span class="promo-icon">🚀🚀🚀</span>
        <span class="promo-text">3D 導覽平台測試中，有意試用請聯繫開發: kofour23348@gmail.com</span>
        <button class="promo-close" onclick="closePromo()">&times;</button>
      </div>

      <!-- 左側：房源資訊卡 -->
      <div class="property-card">
        <h1 class="title" id="listing-title">台北信義區・陽光景觀套房</h1>
        <p class="address" id="listing-address">台北市信義區信義路五段</p>

        <div class="price-line">
          <span class="price" id="listing-price">$25,000 / 月</span>
          <span class="size" id="listing-size">12 坪</span>
          <span class="layout" id="listing-layout">1 房 1 廳</span>
          <span class="floor" id="listing-floor">3F/5F</span>
        </div>

        <p class="desc" id="listing-desc">
          這是一個使用 iPhone 拍攝並透過 3DGS 重建的真實房源。配備全新家具，採光極佳。
        </p>

        <div class="agent-info">
          <!-- ✨ 這個頭像會根據 agentGender 自動更換 -->
          <div class="avatar">👨‍💼</div>
          <div>
            <p class="name" id="agent-name">Evan Chuan</p>
            <p class="role" id="agent-role">房東直租</p>
          </div>
        </div>
      </div>

      <!-- 右側：功能工具列 -->
      <div class="toolbar">
        <div class="toolbar-header">功能選單</div>
        <button id="btn-view" class="tool-btn active" title="瀏覽模式">
          👁️ <span>3D瀏覽</span>
        </button>
        <button id="btn-measure" class="tool-btn" title="量測模式">
          📏 <span>量尺</span>
        </button>
        <button id="btn-home" class="tool-btn" title="回初始位置">
          🏠 <span>回初始位置</span>
        </button>
      </div>

      <!-- 量測結果顯示 (預設隱藏) -->
      <div id="measure-output" class="measure-toast hidden">
        請點擊畫面中的兩點進行測量
      </div>
    </div>

    <!-- 照片放大彈窗 -->
    <div class="gallery-container">
      <div id="gallery" class="gallery"></div>
    </div>
    <div id="photo-overlay" class="photo-overlay hidden">
        <div class="overlay-content">
            <span id="close-overlay" class="close-btn">&times;</span>
            <img id="enlarged-photo" src="" alt="放大照片">
            <div id="photo-info" class="photo-caption"></div>
        </div>
    </div>

    <!-- ✨ 橫幅控制腳本 -->
    <script>
      // 關閉橫幅函數（簡化版）
      function closePromo() {
        const banner = document.getElementById('promo-banner');
        if (banner) {
          banner.style.animation = 'slideUp 0.3s ease-out';
          setTimeout(() => {
            banner.style.display = 'none';
            adjustPropertyCardPosition(false);
          }, 300);
        }
      }

      // 調整資訊卡位置
      function adjustPropertyCardPosition(hasBanner) {
        const card = document.querySelector('.property-card');
        if (card) {
          if (hasBanner) {
            if (window.innerWidth <= 480) {
              card.style.top = '45px';
            } else if (window.innerWidth <= 768) {
              card.style.top = '50px';
            } else {
              card.style.top = '60px';
            }
          } else {
            if (window.innerWidth <= 480) {
              card.style.top = '8px';
            } else if (window.innerWidth <= 768) {
              card.style.top = '10px';
            } else {
              card.style.top = '20px';
            }
          }
        }
      }

      // 初始狀態：有橫幅
      adjustPropertyCardPosition(true);

      // 響應式調整
      window.addEventListener('resize', () => {
        const banner = document.getElementById('promo-banner');
        const hasBanner = banner && banner.style.display !== 'none';
        adjustPropertyCardPosition(hasBanner);
      });
    </script>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
